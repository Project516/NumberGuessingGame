name: Build AppImage

on:
  release:
    types: [created]

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Build AppImage
      uses: AppImageCrafters/build-appimage@master
      env:
        UPDATE_INFO: gh-releases-zsync|Project516|NumberGuessingGame|latest|*x86_64.AppImage.zsync
      with:
        recipe: appimage/AppImageBuilder.yml

    - name: Upload AppImage artifact
      uses: actions/upload-artifact@v7
      with:
        name: NumberGuessingGame.AppImage
        path: NumberGuessingGame.AppImage
        if-no-files-found: error
